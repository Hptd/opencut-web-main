# OpenCut static editor — nginx location config
# Site is served at https://www.hptd.cn/pr/
# The build output (apps/web/out/) is placed at /www/wwwroot/hptd/pr/
#
# Include this inside the server{} block of www.hptd.cn.

# Normalize /pr -> /pr/
location = /pr {
    return 301 /pr/;
}

location /pr/ {
    alias /www/wwwroot/hptd/pr/;
    index index.html;
    try_files $uri $uri/ /pr/index.html;
}

# Immutable hashed build assets
location /pr/_next/static/ {
    alias /www/wwwroot/hptd/pr/_next/static/;
    expires 1y;
    add_header Cache-Control "public, immutable";
}

# Optional: gzip (only if not already enabled globally)
# gzip on;
# gzip_types text/css application/javascript application/json application/wasm image/svg+xml;
